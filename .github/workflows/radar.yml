# Every morning at 8:00 IST: fetch hackathons, publish the website to GitHub
# Pages, and email the digest. Run it by hand from the Actions tab too.
name: Radar

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      RADAR_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      HAS_GMAIL: ${{ secrets.GMAIL_USER != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Yesterday's list carries each hackathon's first-seen date, which is what "new" means.
      - name: Fetch yesterday's list
        run: mkdir -p web/data && curl -fsSL "${RADAR_URL}data/hackathons.json" -o web/data/hackathons.json || rm -f web/data/hackathons.json

      - run: npm run sync
      - run: npm run refresh

      - name: Email the digest
        if: env.HAS_GMAIL == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: node scripts/digest.mjs --no-refresh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
