<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hackathon-bud</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=panchang@500,600,800&f[]=satoshi@400,500,700&display=swap">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="head"><span class="mark" aria-label="Hackathon-bud">Hackath<span class="o">o</span>n<span class="dash">-</span>bud</span><p id="headline"></p></div>
    <button class="btn" type="button" id="refresh">Check now</button>
  </header>
  <form class="where" id="where" aria-label="Where">
    <label class="visually-hidden" for="w">Where</label>
    <select id="w" name="w">
      <option value="any">Anywhere in India, and online</option>
      <option value="online">Online only</option>
      <option value="north">North India, and online</option>
      <option value="south">South India, and online</option>
      <option value="west">West India, and online</option>
      <option value="east">East India, and online</option>
      <option value="central">Central India, and online</option>
    </select>
  </form>
  <ol class="list" id="list" aria-live="polite"></ol>
  <footer class="foot">
    <p id="status"></p>
    <a id="full" href="http://localhost:4321/" target="_blank" rel="noopener">See every hackathon</a>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
