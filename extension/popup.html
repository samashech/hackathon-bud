<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hackathon radar</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <h1 id="headline">Radar</h1>
    <button class="btn" type="button" id="refresh">Check now</button>
  </header>
  <form class="where" id="where" aria-label="Where">
    <label><input type="radio" name="w" value="all" checked><span>All</span></label>
    <label><input type="radio" name="w" value="online"><span>Online</span></label>
    <label><input type="radio" name="w" value="north"><span>North India</span></label>
    <label><input type="radio" name="w" value="bangalore"><span>Bengaluru</span></label>
  </form>
  <ol class="list" id="list" aria-live="polite"></ol>
  <footer class="foot">
    <p id="status"></p>
    <a id="full" href="http://localhost:4321/" target="_blank" rel="noopener">Open the full radar</a>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
