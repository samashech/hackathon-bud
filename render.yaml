# Render Blueprint: New > Blueprint, pick this repo, fill in the secrets.
#
# Paid Starter instance ($7/month) so it never sleeps: the 8:00 IST digest and
# the six-hourly refresh run on their own, no outside pinger needed. Subscribers
# and the list live on a 1 GB persistent disk (about $0.25/month), which
# survives deploys. Roughly $7.25 a month, so $50 of credit lasts about six months.
services:
  - type: web
    name: hackathon-bud
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run sync
    startCommand: node server.mjs
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATA_DIR
        value: /var/data
      # Mail: either SMTP_URL + MAIL_FROM (any provider, any sender address)
      # or GMAIL_USER + GMAIL_APP_PASSWORD (the Gmail address is the sender).
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: CRON_SECRET
        generateValue: true
