# Render Blueprint: New > Blueprint, pick this repo, fill in the secrets.
#
# Free plan. A free service sleeps after 15 minutes without visitors and its
# disk is wiped whenever it sleeps or redeploys, so:
#   - subscribers and the list live in Postgres (DATABASE_URL; a free Neon
#     database never expires), and
#   - .github/workflows/wake.yml calls /api/cron on a schedule, which wakes the
#     service, refreshes the list and sends the 8:00 IST digest.
services:
  - type: web
    name: hackathon-bud
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: node server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      # Mail. Render's free plan blocks outgoing SMTP, so use the Gmail relay:
      # MAIL_RELAY_URL + MAIL_RELAY_SECRET (deploy/gmail-relay.gs). SMTP_URL and
      # GMAIL_* only work on hosts that allow SMTP, such as your own machine.
      - key: MAIL_RELAY_URL
        sync: false
      - key: MAIL_RELAY_SECRET
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: CRON_SECRET
        sync: false
